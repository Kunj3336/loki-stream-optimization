server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: bad_services
    static_configs:
      - targets:
          - localhost
        labels:
          job: demo-apps
          __path__: /var/log/apps/*.log
    pipeline_stages:
      # Parse the JSON log line
      - json:
          expressions:
            service: service
            level: level
            request_id: request_id
            user_id: user_id
            order_id: order_id
      # ANTI-PATTERN: Extracting high-cardinality IDs directly into Loki stream labels!
      - labels:
          service:
          level:
          request_id:
          user_id:
          order_id: